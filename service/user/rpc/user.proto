
syntax = "proto3";

package user;

option go_package = "./user";

service User {
  // ---- 对外：由 user-api 调用 ----
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);

  // ---- 内部：由 file / storage 服务调用 ----
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  // ReserveQuota 预占额度：reserved += bytes。
  rpc ReserveQuota(ReserveQuotaRequest) returns (ReserveQuotaResponse);
  // CommitQuota 提交额度：used += bytes, reserved -= bytes。
  rpc CommitQuota(CommitQuotaRequest) returns (CommitQuotaResponse);
  // ReleaseQuota 归还预占额度：reserved -= bytes（上传取消）。
  rpc ReleaseQuota(ReleaseQuotaRequest) returns (ReleaseQuotaResponse);
  // ReleaseUsedQuota 归还已用额度：used -= bytes（文件删除）。
  rpc ReleaseUsedQuota(ReleaseUsedQuotaRequest) returns (ReleaseUsedQuotaResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message RegisterResponse {
  int64 user_id = 1;
  string username = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message LogoutRequest {
  int64 user_id = 1;
  // 为空时撤销该用户全部 refresh token（退出所有设备）。
  string refresh_token = 2;
}

message LogoutResponse {
  bool success = 1;
  int64 revoked_count = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message GetUserRequest {
  int64 user_id = 1;
}

message GetUserResponse {
  int64 user_id = 1;
  string username = 2;
  string email = 3;
  bool active = 4;
  int64 created_at = 5;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  int64 user_id = 2;
  string username = 3;
}

message GetQuotaRequest {
  int64 user_id = 1;
}

message GetQuotaResponse {
  int64 total_bytes = 1;
  int64 used_bytes = 2;
  int64 reserved_bytes = 3;
}

message ReserveQuotaRequest {
  int64 user_id = 1;
  int64 request_bytes = 2;
  string request_id = 3;
}

message ReserveQuotaResponse {
  bool success = 1;
  int64 reserved_bytes = 2;
  string reason = 3;
}

message CommitQuotaRequest {
  int64 user_id = 1;
  int64 bytes = 2;
  string request_id = 3;
}

message CommitQuotaResponse {
  bool success = 1;
  string reason = 2;
}

message ReleaseQuotaRequest {
  int64 user_id = 1;
  int64 release_bytes = 2;
  string request_id = 3;
}

message ReleaseQuotaResponse {
  bool success = 1;
  string reason = 2;
}

message ReleaseUsedQuotaRequest {
  int64 user_id = 1;
  int64 release_bytes = 2;
  string request_id = 3;
}

message ReleaseUsedQuotaResponse {
  bool success = 1;
  string reason = 2;
}
