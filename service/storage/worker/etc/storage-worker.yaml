Name: storage-worker
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:13306)/cloud-drive?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&interpolateParams=true
CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node
    Pass:
Minio:
  Endpoint: 127.0.0.1:19000
  AccessKey: minioadmin
  SecretKey: minioadmin
  Bucket: cloud-drive
  UseSSL: false
Kafka:
  Brokers:
    - 127.0.0.1:19092
  Topic: storage.events
  GroupID: storage-worker
Worker:
  RetryMax: 5
  Backoff: 2
  MaxBackoff: 60
Log:
  ServiceName: storage-worker
  Mode: console
  Encoding: json
  Level: info
