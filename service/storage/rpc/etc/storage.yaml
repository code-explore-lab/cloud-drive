Name: storage.rpc
Timeout: 60000
ListenOn: 127.0.0.1:9002
Etcd:
  Hosts:
    - 127.0.0.1:12379
  Key: storage.rpc
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:13306)/cloud-drive?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&interpolateParams=true
CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node
    Pass:
Minio:
  Endpoint: 127.0.0.1:19000
  AccessKey: minioadmin
  SecretKey: minioadmin
  Bucket: cloud-drive
  UseSSL: false
Maintenance:
  Enabled: true
  Interval: 600
  UploadTTL: 24
  BatchSize: 200
Kafka:
  Brokers:
    - 127.0.0.1:19092
  Topic: storage.events
Outbox:
  Enabled: true
  Interval: 1
  BatchSize: 100
  MaxAttempts: 5
Log:
  ServiceName: storage.rpc
  Mode: console
  Encoding: json
  Level: info