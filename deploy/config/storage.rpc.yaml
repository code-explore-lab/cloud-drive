Name: storage.rpc
ListenOn: 0.0.0.0:9002
Etcd:
  Hosts:
    - etcd:2379
  Key: storage.rpc
Mysql:
  DataSource: ${MYSQL_DSN}
CacheRedis:
  - Host: redis:6379
    Type: node
    Pass: ${REDIS_PASSWORD}
Minio:
  Endpoint: ${MINIO_ENDPOINT}
  AccessKey: ${MINIO_ACCESS_KEY}
  SecretKey: ${MINIO_SECRET_KEY}
  Bucket: ${MINIO_BUCKET}
  UseSSL: ${MINIO_USE_SSL}
Maintenance:
  Enabled: true
  Interval: 600
  UploadTTL: 24
  BatchSize: 200
Kafka:
  Brokers:
    - ${KAFKA_BROKERS}
  Topic: storage.events
Outbox:
  Enabled: true
  Interval: 1
  BatchSize: 100
  MaxAttempts: 5
Log:
  ServiceName: storage.rpc
  Mode: console
  Encoding: json
  Level: info