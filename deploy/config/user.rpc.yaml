Name: user.rpc
ListenOn: 0.0.0.0:9000
Etcd:
  Hosts:
    - etcd:2379
  Key: user.rpc
Mysql:
  DataSource: ${MYSQL_DSN}
CacheRedis:
  - Host: redis:6379
    Type: node
    Pass: ${REDIS_PASSWORD}
JwtSecret: ${JWT_SECRET}
Salt: ${USER_SALT}
Log:
  ServiceName: user.rpc
  Mode: console
  Encoding: json
  Level: info