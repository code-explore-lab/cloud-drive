# ============================================================================
# CloudDrive Secret 示例（骨架）
# ============================================================================
# 安全提示：
#   - 本文件中的值全部是占位符，不能直接用于生产。
#   - 不要把填好的真实 Secret 提交到 Git；建议复制为 secret.yaml 后加入 .gitignore，
#     或直接用 README 中的 kubectl create secret 命令创建。
#   - 生产环境建议使用 External Secrets / Sealed Secrets / Vault 等方案管理密钥。
#
# 用法：
#   cp deploy/kubernetes/secret.example.yaml deploy/kubernetes/secret.yaml
#   # 编辑 secret.yaml，填入真实值
#   kubectl apply -f deploy/kubernetes/secret.yaml
#
# 注意：
#   - MYSQL_DSN 里的密码必须与 MYSQL_ROOT_PASSWORD 保持一致（与 docker-compose.yml 的
#     单实例初始化方式对齐）；生产应改用独立数据库账号，不要再给应用 root 权限。
#   - MINIO_ACCESS_KEY / MINIO_SECRET_KEY 同时作为 MinIO 的 root 账号（infra.yaml 中的
#     MINIO_ROOT_USER / MINIO_ROOT_PASSWORD）。这样可以避免在 Secret 中重复维护两套值；
#     生产建议为应用单独创建 MinIO 用户和最小权限策略。
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloud-drive-secret
  namespace: cloud-drive
  labels:
    app.kubernetes.io/name: cloud-drive
    app.kubernetes.io/part-of: cloud-drive
type: Opaque
stringData:
  # MySQL 连接串。主机名使用 namespace 内的 Service 名 mysql，端口 3306。
  # 密码占位符 REPLACE_WITH_MYSQL_ROOT_PASSWORD 必须与下面的 MYSQL_ROOT_PASSWORD 相同。
  MYSQL_DSN: 'root:REPLACE_WITH_MYSQL_ROOT_PASSWORD@tcp(mysql:3306)/cloud-drive?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai'

  # 仅 infra.yaml 中 MySQL StatefulSet 初始化时使用；应用本身只读 MYSQL_DSN。
  MYSQL_ROOT_PASSWORD: 'REPLACE_WITH_MYSQL_ROOT_PASSWORD'

  # 用户服务 JWT 签名密钥。泄露等于任何人可伪造 token，请使用足够长的随机值。
  JWT_SECRET: 'REPLACE_WITH_RANDOM_JWT_SECRET'

  # 用户密码哈希盐。
  USER_SALT: 'REPLACE_WITH_RANDOM_USER_SALT'

  # file-api 与 storage-api 之间的内部调用令牌。
  INTERNAL_TOKEN: 'REPLACE_WITH_RANDOM_INTERNAL_TOKEN'

  # MinIO 凭据（同时作为 MinIO root 账号；access key 至少 3 字符，secret key 至少 8 字符）。
  MINIO_ACCESS_KEY: 'REPLACE_WITH_MINIO_ACCESS_KEY'
  MINIO_SECRET_KEY: 'REPLACE_WITH_MINIO_SECRET_KEY'
