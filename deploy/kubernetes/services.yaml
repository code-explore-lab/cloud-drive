apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
  namespace: cloud-drive
  labels:
    app.kubernetes.io/name: storage-api
    app.kubernetes.io/part-of: cloud-drive
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-api
      app.kubernetes.io/part-of: cloud-drive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-api
        app.kubernetes.io/part-of: cloud-drive
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-api
          image: cloud-drive/storage-api:latest
          imagePullPolicy: IfNotPresent
          args: ["-f", "/app/etc/config.yaml"]
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cloud-drive-env
            - secretRef:
                name: cloud-drive-secret
          # /readyz 会检查 MinIO bucket 是否可用；bucket 尚未创建时不接流量。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/etc/config.yaml
              subPath: storage-api.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cloud-drive-config
            defaultMode: 0444
            items:
              - key: storage-api.yaml
                path: storage-api.yaml
        - name: tmp
          emptyDir: {}

