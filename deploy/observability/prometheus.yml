global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: clouddrive-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-api:6060
          - file-api:6060
          - storage-api:6060
        labels:
          tier: api

  - job_name: clouddrive-rpc
    metrics_path: /metrics
    static_configs:
      - targets:
          - user.rpc:6060
          - file.rpc:6060
          - storage.rpc:6060
        labels:
          tier: rpc

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
